<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울 버스정류장 대시보드</title>

  <!-- PyScript (팀 api-test.html과 같은 버전) -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <link rel="stylesheet" href="./dashboard.css">

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5e59c6b3d5a1480cc9db3a3e8751c3a8&libraries=services"></script> 
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>

  <header class="topbar">
    <h1>🚌 서울 버스정류장 대시보드</h1>
    <p>내 위치 주변의 가까운 정류장을 찾아보세요</p>
  </header>

  <main class="layout">

    <!-- ========== 왼쪽: 입력 / 필터 / 결과 ========== -->
    <aside class="panel">

      <section class="card" id="search-card">
        <h2>1. 위치 입력</h2>

        <label for="input-address">주소</label>
        <div class="row">
          <!-- 파이썬 main.py와 ID 일치화 -->
          <input type="text" id="input-address" placeholder="예) 서울특별시 중구 세종대로 110">
          <button type="button" id="btn-search-address" class="btn btn-sub">주소 → 좌표</button>
        </div>
        <div class="row">
          <button type="button" id="btn-current-location" class="btn btn-sub">📍 내 위치 가져오기</button>
        </div>
      </section>

      <!-- 가까운 정류장 리스트: main.py가 #station-list를 채워 넣습니다 -->
      <section class="card" id="result-box">
        <h2>가까운 정류장 리스트</h2>
        <ol class="result-list" id="station-list"></ol>
      </section>

      <!-- 통계 그래프 영역: main.py가 #graph-container에 그래프를 그려줍니다 -->
      <section class="card" id="graph-box">
        <h2>정류장 통계 그래프</h2>
        <div id="graph-container"></div>
      </section>
    </aside>

    <!-- ========== 오른쪽: 지도 (main.py가 #map-container에 지도를 그려요) ========== -->
    <section class="map-area">
      <div id="map-container" style="width: 100%; height: 100%;">
        <div class="map-placeholder">
          <p>🗺️</p>
          <p>왼쪽에서 위치를 입력하거나<br><strong>[내 위치 가져오기]</strong>를 눌러주세요</p>
        </div>
      </div>
    </section>

  </main>

  <!-- 파이썬 메인 연동 코드 -->
  <script type="py" src="./main.py" config="./pyscript.json"></script>
</body>
</html>
