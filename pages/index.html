<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusFinder 대시보드</title>

    <!-- 1. 카카오 지도 SDK (발급받은 JS 키 입력 필수, libraries=services 포함) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_카카오_JS_키_입력&libraries=services"></script>

    <!-- 2. PyScript 런타임 -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.8.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.8.2/core.js"></script>

    <style>
        body { font-family: sans-serif; margin: 20px; background: #f8f9fa; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 8px; font-size: 14px; }
        .search-bar button { padding: 8px 16px; cursor: pointer; }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        #map-container { min-height: 450px; }
        #station-list { list-style: none; padding: 0; margin: 0; line-height: 1.8; }
        #graph-container { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>

<body>
    <h1>BusFinder - 주변 버스 정류소 탐색 대시보드</h1>

    <!-- 검색 및 내 위치 컨트롤 영역 -->
    <div class="search-bar">
        <input id="input-address" type="text" placeholder="도로명 또는 지번 주소를 입력하세요 (예: 서울 노원구 광운로 20)" />
        <button id="btn-search-address" type="button">가까운 정류소 찾기</button>
        <button id="btn-current-location" type="button">내 위치 가져오기</button>
    </div>

    <!-- 지도 및 정류소 리스트 영역 -->
    <div class="dashboard-grid">
        <div class="card">
            <h3>서울시 지도 및 주변 정류소 마커</h3>
            <div id="map-container">로딩 중...</div>
        </div>
        <div class="card">
            <h3>가까운 정류소 TOP 10</h3>
            <ul id="station-list"></ul>
        </div>
    </div>

    <!-- 통계 그래프 영역 -->
    <div class="card" style="margin-top: 20px;">
        <h3>주변 정류소 통계 그래프</h3>
        <div id="graph-container"></div>
    </div>

    <!-- 3. PyScript 메인 엔트리 실행 -->
    <script type="py" src="../scr/main.py" config="./pyscript.toml"></script>
</body>
</html>
